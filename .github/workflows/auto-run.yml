name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 次日 6:00
  workflow_dispatch:
  push:
    paths:
      - 'source_list.csv'

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # ★★★ 用 --no-html，不要用 --update ★★★
      - name: Fetch latest wallpapers
        run: python main.py --no-html
        continue-on-error: true

      # ★★★ 关键：生成 JSON 数据 ★★★
      - name: Generate JSON data
        run: python generate_data.py

      - name: Commit and push changes
        run: |
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"
          git add source_list.csv data/wallpapers.json
          git diff --staged --quiet || git commit -m "Daily wallpaper update [skip ci]"
          git push
