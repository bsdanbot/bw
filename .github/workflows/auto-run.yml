name: 自动抓取必应壁纸

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-wallpaper:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: pip install requests pandas
      
      # ★★★ 改成 --update ★★★
      - name: 抓取壁纸数据
        run: |
          python main.py --update
      
      - name: 检查变更
        id: check_changes
        run: |
          git add source_list.csv data/wallpapers.json
          if git status --porcelain | grep -q "^"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 有新数据，准备提交"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏸️ 没有新的壁纸数据"
          fi
      
      - name: 提交变更
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'bsdanbot'
          git config --global user.email 'bsdanbot@users.noreply.github.com'
          git commit -m "auto update $(date +'%Y-%m-%d')"
          git push
      
      - name: 创建 Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "auto update"
          title: "自动更新壁纸数据"
          body: "由机器人 bsdanbot 自动生成的更新"
          base: main
          branch: bot-update
