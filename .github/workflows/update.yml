name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bsdanbot/bw (workflow branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PAT }}
          ref: workflow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch and generate data
        run: |
          python main.py --no-html --no-image
          python generate_data.py

      - name: Push data files only
        run: |
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"

          # ★★★ 切换回 main 分支（不含 .github）★★★
          git checkout main

          # ★★★ 从 workflow 分支复制数据文件 ★★★
          git checkout workflow -- source_list.csv data/wallpapers.json

          # ★★★ 只添加数据文件 ★★★
          git add source_list.csv data/wallpapers.json

          if git diff --staged --quiet; then
            echo "⏸️ 没有新的壁纸数据，跳过提交"
            exit 0
          fi

          git commit -m "Daily wallpaper update [skip ci]"

          # ★★★ 推送到主仓库 ★★★
          echo "🚀 推送到主仓库 chnbsdan/bw..."
          git push --force https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main

          echo "✅ 推送完成！"
