name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    # 每天 UTC 22:00 运行（北京时间早上 6:00）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1. 检出 bsdanbot/bw 仓库
      # ============================================
      - name: Checkout bsdanbot/bw
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PAT }}

      # ============================================
      # 2. 设置 Python 环境
      # ============================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ============================================
      # 3. 安装依赖
      # ============================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # ============================================
      # 4. 先拉取主仓库的最新数据文件（只拉数据，不合并其他）
      # ============================================
      - name: Pull latest data files from main repo
        run: |
          echo "🔄 获取主仓库最新数据文件..."
          git fetch https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main
          # 只检出数据文件，不合并其他任何文件
          git checkout FETCH_HEAD -- source_list.csv data/wallpapers.json 2>/dev/null || true
          # 确保这两个文件被跟踪
          git add source_list.csv data/wallpapers.json

      # ============================================
      # 5. 抓取最新壁纸数据
      # ============================================
      - name: Fetch latest wallpapers
        run: python main.py --no-html --no-image

      # ============================================
      # 6. 生成 JSON 数据
      # ============================================
      - name: Generate JSON data
        run: python generate_data.py

      # ============================================
      # 7. 只提交数据文件到主仓库
      # ============================================
      - name: Commit and push ONLY data files
        run: |
          # 配置 Git 用户为 bsdanbot
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"

          # 只暂存数据文件
          git add source_list.csv data/wallpapers.json

          # 检查数据文件是否有变化
          if git diff --staged --quiet; then
            echo "⏸️ 没有新的壁纸数据，跳过提交"
            exit 0
          fi

          # 提交数据文件
          git commit -m "Daily wallpaper update [skip ci]"

          # 再次拉取主仓库最新数据（防止在运行期间有新的推送）
          echo "🔄 再次同步主仓库..."
          git fetch https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main
          git checkout FETCH_HEAD -- source_list.csv data/wallpapers.json 2>/dev/null || true
          git add source_list.csv data/wallpapers.json

          # 如果有新的数据变化，重新提交
          if git diff --staged --quiet; then
            echo "⏸️ 没有新的壁纸数据变化"
            exit 0
          fi

          git commit -m "Merge data updates from main repo [skip ci]"

          # ★★★ 安全强制推送到主仓库 ★★★
          echo "🚀 推送到主仓库 chnbsdan/bw..."
          git push --force-with-lease https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main

          echo "✅ 已成功推送到主仓库 chnbsdan/bw"
