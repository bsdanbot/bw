name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bsdanbot/bw
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PAT }}
          ref: workflow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Clear cache and fetch wallpapers
        run: |
          # ★★★ 删除缓存目录 ★★★
          rm -rf cache/
          # ★★★ 不加 --no-cache，直接运行 ★★★
          python main.py --no-html --no-image

      - name: Generate JSON
        run: |
          python generate_data.py

      - name: Check if data changed
        id: check
        run: |
          if git diff --quiet source_list.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push data files
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"

          # 只添加数据文件
          git add source_list.csv data/wallpapers.json

          # 提交
          git commit -m "Daily wallpaper update [skip ci]"

          # ★★★ 用克隆方式推送，避免 .github ★★★
          git clone https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git ../main-repo
          cp source_list.csv ../main-repo/
          cp data/wallpapers.json ../main-repo/data/
          cd ../main-repo
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"
          git add source_list.csv data/wallpapers.json
          git commit -m "Daily wallpaper update [skip ci]" || echo "No changes"
          git push origin main

          echo "✅ 推送完成！"
