name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bsdanbot/bw (workflow branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PAT }}
          ref: workflow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Switch to main branch and update data
        run: |
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"

          # 切换到 main 分支
          git checkout main

          # 拉取主仓库最新数据文件
          echo "🔄 同步主仓库数据..."
          git fetch https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main
          git checkout FETCH_HEAD -- source_list.csv data/wallpapers.json 2>/dev/null || true

          # 运行抓取
          python main.py --no-html --no-image
          python generate_data.py

          # 只暂存数据文件
          git add source_list.csv data/wallpapers.json

          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "⏸️ 没有新的壁纸数据，跳过提交"
            exit 0
          fi

          # 提交
          git commit -m "Daily wallpaper update [skip ci]"

          # 推送到主仓库
          echo "🚀 推送到主仓库 chnbsdan/bw..."
          git push --force https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main

          echo "✅ 已成功推送到主仓库 chnbsdan/bw"
