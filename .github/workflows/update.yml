name: Daily Bing Wallpaper Fetcher

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bsdanbot/bw
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch latest wallpapers
        run: python main.py --no-html --no-image

      - name: Generate JSON data
        run: python generate_data.py

      - name: Commit and push ONLY data files
        run: |
          git config --local user.name "bsdanbot"
          git config --local user.email "bsdanbot@users.noreply.github.com"

          # ★★★ 关键：只添加数据文件，绝不碰 .github ★★★
          git add source_list.csv data/wallpapers.json

          if git diff --staged --quiet; then
            echo "⏸️ 没有新的壁纸数据，跳过提交"
            exit 0
          fi

          git commit -m "Daily wallpaper update [skip ci]"

          # ★★★ 拉取主仓库的数据文件更新 ★★★
          echo "🔄 同步主仓库..."
          git fetch https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git main
          git checkout FETCH_HEAD -- source_list.csv data/wallpapers.json 2>/dev/null || true
          git add source_list.csv data/wallpapers.json

          if git diff --staged --quiet; then
            echo "⏸️ 没有新的壁纸数据变化"
            exit 0
          fi

          git commit -m "Merge data updates from main repo [skip ci]"

          # ★★★ 直接推送当前分支（workflow）到主仓库的 main ★★★
          echo "🚀 推送到主仓库 chnbsdan/bw..."
          git push --force https://chnbsdan:${{ secrets.MAIN_PAT }}@github.com/chnbsdan/bw.git HEAD:main

          echo "✅ 已成功推送到主仓库 chnbsdan/bw"
